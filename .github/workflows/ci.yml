name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Static analysis
        run: ./gradlew detekt

      - name: Unit, Compose UI (Robolectric) and rendering tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble the catalog app
        run: ./gradlew :catalog:assembleDebug

      - name: Check the libraries publish (what JitPack runs)
        run: ./gradlew :hmi-components:publishToMavenLocal :hmi-car:publishToMavenLocal

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - uses: actions/upload-artifact@v4
        with:
          name: catalog-debug
          path: catalog/build/outputs/apk/debug/*.apk
